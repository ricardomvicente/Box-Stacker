<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segment Tree Simulator (Vanilla JS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        svg {
            max-width: 100%;
            height: auto;
        }
        .transition-colors {
            transition: fill 0.3s ease, stroke 0.3s ease, background-color 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 p-4 font-sans">
    <div class="max-w-[95%] mx-auto space-y-6">
        
        <!-- Header Controls -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Segment Tree Simulator (LIS)</h1>
                <p class="text-sm text-slate-500">Box Stacking - O(N log N) - Interativo (HTML/JS)</p>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="btn-prev" class="flex items-center gap-1 px-4 py-2 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg font-medium transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    Anterior
                </button>
                <div class="text-center min-w-[120px]">
                    <span id="step-counter" class="text-sm font-semibold">Passo 0 / 0</span>
                </div>
                <button id="btn-next" class="flex items-center gap-1 px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg font-medium transition-colors">
                    Próximo 
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
                <button id="btn-reset" class="flex items-center gap-1 px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition-colors ml-2" title="Reiniciar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
            </div>
        </div>

        <!-- Action Banner -->
        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-xl shadow-sm">
            <p class="text-blue-900 font-medium font-mono text-lg flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                <span id="action-text">A carregar...</span>
            </p>
        </div>

        <!-- SVG Visual Tree -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex items-center justify-center">
            <div class="min-w-[600px] w-full max-w-4xl">
                <svg viewBox="0 0 800 360" class="w-full h-auto" id="tree-svg">
                    <!-- Gerado por JS -->
                </svg>
            </div>
        </div>

        <!-- Tables Section (4 colunas lado a lado) -->
        <div class="grid grid-cols-4 gap-4">
            
            <!-- 1. Boxes -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-100 px-3 py-2 border-b border-slate-200 font-semibold text-xs text-center">
                    1. Vetor Boxes (Ordenado)
                </div>
                <table class="w-full text-[11px] text-center">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="p-1.5 border-r">i</th>
                            <th class="p-1.5 border-r">W</th>
                            <th class="p-1.5 border-r">L</th>
                            <th class="p-1.5">H</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-boxes"></tbody>
                </table>
            </div>

            <!-- 2. Unique Length -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-100 px-3 py-2 border-b border-slate-200 font-semibold text-xs text-center">
                    2. unique_length (Folhas)
                </div>
                <table class="w-full text-[11px] text-center">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="p-1.5 border-r">pos (Idx)</th>
                            <th class="p-1.5">Length (L)</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-unique"></tbody>
                </table>
            </div>

            <!-- 3. Box State -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-100 px-3 py-2 border-b border-slate-200 font-semibold text-xs text-center">
                    3. BoxState (Resultados)
                </div>
                <table class="w-full text-[11px] text-center">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="p-1.5 border-r">i</th>
                            <th class="p-1.5 border-r">max_h</th>
                            <th class="p-1.5 border-r">count</th>
                            <th class="p-1.5">next</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-state"></tbody>
                </table>
            </div>

            <!-- 4. Tree Memory -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-100 px-3 py-2 border-b border-slate-200 font-semibold text-xs text-center">
                    4. Memória Árvore
                </div>
                <table class="w-full text-[11px] text-center">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="p-1.5 border-r">Nó (i)</th>
                            <th class="p-1.5 border-r">Height</th>
                            <th class="p-1.5">Idx</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-tree"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        // Constants - Ordem Invertida
        const BOXES = [
            { w: 1, l: 10, h: 7 },
            { w: 1, l: 7, h: 10 },
            { w: 2, l: 6, h: 5 },
            { w: 2, l: 5, h: 6 },
            { w: 5, l: 20, h: 10 },
            { w: 5, l: 10, h: 20 },
            { w: 5, l: 6, h: 2 },
            { w: 7, l: 10, h: 1 },
            { w: 10, l: 20, h: 5 }
        ];
        
        const UNIQUE_LENGTH = [5, 6, 7, 10, 20];
        
        const TREE_NODES = {
            1: { id: 1, cx: 400, cy: 40, range: '[0,4]' },
            2: { id: 2, cx: 250, cy: 130, range: '[0,2]' },
            3: { id: 3, cx: 550, cy: 130, range: '[3,4]' },
            4: { id: 4, cx: 150, cy: 220, range: '[0,1]' },
            5: { id: 5, cx: 350, cy: 220, range: '[2,2]' },
            6: { id: 6, cx: 480, cy: 220, range: '[3,3]' },
            7: { id: 7, cx: 620, cy: 220, range: '[4,4]' },
            8: { id: 8, cx: 80, cy: 310, range: '[0,0]' },
            9: { id: 9, cx: 220, cy: 310, range: '[1,1]' }
        };
        const TREE_EDGES = [ [1, 2], [1, 3], [2, 4], [2, 5], [3, 6], [3, 7], [4, 8], [4, 9] ];
        
        let historyData = [];
        let currentStep = 0;

        // Gerar História (Algoritmo Invertido)
        function generateHistory() {
            let tree_h = Array(10).fill(0);
            let tree_idx = Array(10).fill(-1);
            let state = Array(9).fill(null).map(() => ({ h: 0, count: 1, next: -1 }));
            let hist = [];

            hist.push({
                action: "Estado Inicial (Árvore Vazia)",
                tree_h: [...tree_h],
                tree_idx: [...tree_idx],
                state: JSON.parse(JSON.stringify(state)),
                activeBox: null
            });

            for (let i = 0; i < 9; i++) {
                let pos = UNIQUE_LENGTH.indexOf(BOXES[i].l);
                let q = { h: 0, idx: -1 };

                // Query Phase: [0, pos - 1]
                if (pos > 0) {
                    const recursiveGet = (node, l, r, tl, tr) => {
                        if (r < tl || l > tr) return { h: 0, idx: -1 };
                        if (l >= tl && r <= tr) return { h: tree_h[node], idx: tree_idx[node] };
                        let mid = Math.floor((l + r) / 2);
                        let resL = recursiveGet(2 * node, l, mid, tl, tr);
                        let resR = recursiveGet(2 * node + 1, mid + 1, r, tl, tr);
                        return resL.h >= resR.h ? resL : resR;
                    };
                    q = recursiveGet(1, 0, 4, 0, pos - 1);
                }

                state[i] = {
                    h: BOXES[i].h + q.h,
                    count: q.idx !== -1 ? 1 + state[q.idx].count : 1,
                    next: q.idx
                };

                hist.push({
                    action: `Caixa ${i} (L=${BOXES[i].l}): Pesq. [0, ${pos > 0 ? pos - 1 : 0}]. Recorde H=${q.h}`,
                    tree_h: [...tree_h],
                    tree_idx: [...tree_idx],
                    state: JSON.parse(JSON.stringify(state)),
                    activeBox: i
                });

                // Update Phase
                const recursiveUpdate = (node, l, r, t_pos, h, idx) => {
                    if (l === r) {
                        if (h > tree_h[node]) {
                            tree_h[node] = h;
                            tree_idx[node] = idx;
                        }
                        return;
                    }
                    let mid = Math.floor((l + r) / 2);
                    if (t_pos <= mid) recursiveUpdate(2 * node, l, mid, t_pos, h, idx);
                    else recursiveUpdate(2 * node + 1, mid + 1, r, t_pos, h, idx);

                    if (tree_h[2 * node] >= tree_h[2 * node + 1]) {
                        tree_h[node] = tree_h[2 * node];
                        tree_idx[node] = tree_idx[2 * node];
                    } else {
                        tree_h[node] = tree_h[2 * node + 1];
                        tree_idx[node] = tree_idx[2 * node + 1];
                    }
                };

                recursiveUpdate(1, 0, 4, pos, state[i].h, i);

                hist.push({
                    action: `Caixa ${i}: Atualiza Árvore (Pos=${pos}) com H=${state[i].h}`,
                    tree_h: [...tree_h],
                    tree_idx: [...tree_idx],
                    state: JSON.parse(JSON.stringify(state)),
                    activeBox: i
                });
            }
            
            hist.push({
                action: `Fim do Algoritmo. Maior Torre H=${tree_h[1]} (Base: Caixa ${tree_idx[1]})`,
                tree_h: [...tree_h],
                tree_idx: [...tree_idx],
                state: JSON.parse(JSON.stringify(state)),
                activeBox: tree_idx[1]
            });

            return hist;
        }

        // Setup inicial do SVG base (apenas as linhas)
        function setupSVG() {
            const svg = document.getElementById('tree-svg');
            let svgContent = '';
            
            // Desenhar Arestas (Edges)
            TREE_EDGES.forEach(([u, v]) => {
                const n1 = TREE_NODES[u];
                const n2 = TREE_NODES[v];
                svgContent += `<line x1="${n1.cx}" y1="${n1.cy}" x2="${n2.cx}" y2="${n2.cy}" stroke="#cbd5e1" stroke-width="3"></line>`;
            });

            // Adicionar grupos vazios para os nós
            Object.values(TREE_NODES).forEach(node => {
                svgContent += `<g id="node-group-${node.id}" class="transition-colors"></g>`;
            });

            svg.innerHTML = svgContent;
        }

        // Renderizar Passo
        function renderStep(step) {
            const data = historyData[step];
            const prevData = step > 0 ? historyData[step - 1] : data;
            
            // 1. Atualizar Controlos
            document.getElementById('step-counter').innerText = `Passo ${step} / ${historyData.length - 1}`;
            document.getElementById('action-text').innerText = data.action;
            document.getElementById('btn-prev').disabled = step === 0;
            document.getElementById('btn-next').disabled = step === historyData.length - 1;

            // 2. Atualizar Nós do SVG
            Object.values(TREE_NODES).forEach(node => {
                const group = document.getElementById(`node-group-${node.id}`);
                const hVal = data.tree_h[node.id];
                const idxVal = data.tree_idx[node.id];
                
                // Determinar estado visual
                const isUpdated = step > 0 && hVal !== prevData.tree_h[node.id];
                const hasRecord = hVal > 0;
                
                const fill = isUpdated ? '#fef3c7' : (hasRecord ? '#f0f9ff' : 'white');
                const stroke = isUpdated ? '#d97706' : (hasRecord ? '#3b82f6' : '#94a3b8');

                group.innerHTML = `
                    <circle cx="${node.cx}" cy="${node.cy}" r="35" fill="${fill}" stroke="${stroke}" stroke-width="3" class="transition-colors"></circle>
                    <text x="${node.cx}" y="${node.cy - 16}" text-anchor="middle" font-size="11" fill="#64748b" font-weight="bold">N${node.id} ${node.range}</text>
                    <text x="${node.cx}" y="${node.cy + 4}" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="900">H: ${hVal}</text>
                    <text x="${node.cx}" y="${node.cy + 22}" text-anchor="middle" font-size="12" fill="#475569">Idx: ${idxVal}</text>
                `;
            });

            // 3. Renderizar Tabelas
            // Tabela Boxes
            let boxesHtml = '';
            BOXES.forEach((b, i) => {
                const active = data.activeBox === i ? 'bg-amber-100 font-bold' : '';
                boxesHtml += `<tr class="border-b transition-colors ${active}">
                    <td class="p-1.5 border-r text-slate-500">${i}</td>
                    <td class="p-1.5 border-r">${b.w}</td>
                    <td class="p-1.5 border-r">${b.l}</td>
                    <td class="p-1.5">${b.h}</td>
                </tr>`;
            });
            document.getElementById('tbody-boxes').innerHTML = boxesHtml;

            // Tabela Unique Length
            let uniqueHtml = '';
            const activeLength = data.activeBox !== null ? BOXES[data.activeBox].l : null;
            UNIQUE_LENGTH.forEach((l, i) => {
                const active = l === activeLength ? 'bg-amber-100 font-bold' : '';
                uniqueHtml += `<tr class="border-b transition-colors ${active}">
                    <td class="p-1.5 border-r text-slate-500">${i}</td>
                    <td class="p-1.5">${l}</td>
                </tr>`;
            });
            // Preencher com linhas vazias
            for(let i = UNIQUE_LENGTH.length; i < 9; i++) {
                uniqueHtml += `<tr><td class="p-1.5 border-r text-transparent">-</td><td class="p-1.5"></td></tr>`;
            }
            document.getElementById('tbody-unique').innerHTML = uniqueHtml;

            // Tabela BoxState
            let stateHtml = '';
            data.state.forEach((st, i) => {
                const active = data.activeBox === i ? 'bg-amber-100 font-bold' : '';
                stateHtml += `<tr class="border-b transition-colors ${active}">
                    <td class="p-1.5 border-r text-slate-500">${i}</td>
                    <td class="p-1.5 border-r text-blue-700 font-bold">${st.h}</td>
                    <td class="p-1.5 border-r">${st.count}</td>
                    <td class="p-1.5">${st.next}</td>
                </tr>`;
            });
            document.getElementById('tbody-state').innerHTML = stateHtml;

            // Tabela Tree Memory
            let treeHtml = '';
            [1, 2, 3, 4, 5, 6, 7, 8, 9].forEach((nodeId) => {
                const isUpdated = step > 0 && data.tree_h[nodeId] !== prevData.tree_h[nodeId];
                const active = isUpdated ? 'bg-orange-100 font-bold' : '';
                treeHtml += `<tr class="border-b transition-colors ${active}">
                    <td class="p-1.5 border-r text-slate-500">${nodeId}</td>
                    <td class="p-1.5 border-r">${data.tree_h[nodeId]}</td>
                    <td class="p-1.5">${data.tree_idx[nodeId]}</td>
                </tr>`;
            });
            document.getElementById('tbody-tree').innerHTML = treeHtml;
        }

        // Event Listeners e Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            historyData = generateHistory();
            setupSVG();
            renderStep(currentStep);

            document.getElementById('btn-prev').addEventListener('click', () => {
                if (currentStep > 0) {
                    currentStep--;
                    renderStep(currentStep);
                }
            });

            document.getElementById('btn-next').addEventListener('click', () => {
                if (currentStep < historyData.length - 1) {
                    currentStep++;
                    renderStep(currentStep);
                }
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                currentStep = 0;
                renderStep(currentStep);
            });
        });
    </script>
</body>
</html>
